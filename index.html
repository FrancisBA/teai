<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teai</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04070f; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #dfe9ff; }
  #field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #veil {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, transparent 30%, rgba(2,4,10,.72) 100%);
  }
  #listen {
    position: fixed; top: 24px; left: 26px; z-index: 4;
    border: 1px solid rgba(190,215,255,.28); border-radius: 999px;
    background: rgba(10,18,34,.35); color: #c9dcff;
    padding: 8px 18px; font-size: 12px; letter-spacing: .18em; text-transform: lowercase;
    cursor: pointer; backdrop-filter: blur(6px); transition: opacity .5s, border-color .5s;
  }
  #listen:hover { border-color: rgba(190,215,255,.6); }
  #whisper {
    position: fixed; top: 30px; right: 32px; z-index: 4;
    font-size: 13px; font-style: italic; letter-spacing: .06em;
    color: rgba(226,236,255,.72); opacity: 0; transition: opacity 1.2s ease;
    text-align: right; max-width: 40vw;
  }
  #whisper.visible { opacity: 1; }
  #nodeLayer { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .node {
    position: absolute; transform: translate(-50%, -50%);
    padding: 9px 15px; border-radius: 999px; white-space: nowrap;
    font-size: 12px; letter-spacing: .04em; color: rgba(233,241,255,.9);
    background: rgba(18,30,54,.5); border: 1px solid rgba(180,210,255,.22);
    box-shadow: 0 0 30px rgba(96,150,255,.18); pointer-events: auto;
    animation: bloom 1.4s cubic-bezier(.16,1,.3,1) both;
    backdrop-filter: blur(5px);
  }
  @keyframes bloom {
    from { opacity: 0; transform: translate(-50%, -50%) scale(.55); filter: blur(6px); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
  }
  #capture {
    position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
    z-index: 5; width: min(520px, 82vw);
  }
  #phrase {
    width: 100%; border: 0; outline: 0; background: transparent;
    color: #e8f0ff; text-align: center; font-size: 15px;
    letter-spacing: .08em; padding: 12px 0;
    border-bottom: 1px solid rgba(180,210,255,.18);
    transition: border-color .6s;
  }
  #phrase::placeholder { color: rgba(200,218,255,.32); }
  #phrase:focus { border-color: rgba(180,210,255,.55); }
  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    z-index: 5; font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(200,218,255,.24); pointer-events: none;
  }
  @media (max-width: 600px) {
    #whisper { max-width: 55vw; font-size: 11px; }
    #listen { top: 16px; left: 16px; }
  }
</style>
</head>
<body>
<canvas id="field"></canvas>
<div id="veil"></div>
<button id="listen" type="button">listen</button>
<div id="whisper" aria-live="polite"></div>
<div id="nodeLayer"></div>
<form id="capture" autocomplete="off">
  <input id="phrase" type="text" placeholder="a thought, softly" aria-label="a thought, softly">
</form>
<div id="hint">type a thought &middot; press enter</div>
<script src="resonance.js"></script>
<script>
(() => {
  const R = window.TeaiResonance
  const canvas = document.getElementById('field')
  const ctx = canvas.getContext('2d')
  const listenButton = document.getElementById('listen')
  const whisper = document.getElementById('whisper')
  const nodeLayer = document.getElementById('nodeLayer')
  const form = document.getElementById('capture')
  const phrase = document.getElementById('phrase')

  const nudges = [
    'soften your breath',
    'let the pace ease',
    'one thing at a time',
    'room to breathe'
  ]

  const state = {
    score: 0,
    lastFrame: performance.now(),
    lastInputAt: performance.now(),
    lastNudgeAt: -100000,
    nudgeUntil: 0,
    highSince: null,
    sequence: 0,
    nodes: [],
    audio: null,
    keyTimes: [],
    pointerTimes: []
  }

  let width = 0
  let height = 0
  let ratio = 1

  function resize() {
    ratio = Math.min(window.devicePixelRatio || 1, 2)
    width = window.innerWidth
    height = window.innerHeight
    canvas.width = Math.floor(width * ratio)
    canvas.height = Math.floor(height * ratio)
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0)
  }

  function readAudio(now) {
    if (!state.audio) return { micLevel: null, spectralCentroid: null }
    const { analyser, timeData, freqData } = state.audio
    analyser.getByteTimeDomainData(timeData)
    analyser.getByteFrequencyData(freqData)
    let energy = 0
    for (let i = 0; i < timeData.length; i++) {
      const sample = (timeData[i] - 128) / 128
      energy += sample * sample
    }
    const micLevel = Math.sqrt(energy / timeData.length)
    let weighted = 0
    let total = 0
    for (let i = 0; i < freqData.length; i++) {
      weighted += i * freqData[i]
      total += freqData[i]
    }
    const spectralCentroid = total > 0 ? (weighted / total) / freqData.length : 0
    return { micLevel, spectralCentroid }
  }

  function markKey() {
    state.keyTimes.push(performance.now())
    state.lastInputAt = performance.now()
  }

  function markPointer() {
    state.pointerTimes.push(performance.now())
    state.lastInputAt = performance.now()
  }

  function showWhisper(text, now) {
    whisper.textContent = text
    whisper.classList.add('visible')
    state.nudgeUntil = now + 4000
    window.setTimeout(() => whisper.classList.remove('visible'), 4000)
  }

  function renderNode(node) {
    const element = document.createElement('div')
    element.className = 'node'
    element.textContent = node.text
    element.style.left = `${node.x * 100}%`
    element.style.top = `${node.y * 100}%`
    element.dataset.id = node.id
    nodeLayer.appendChild(element)
  }

  function addNode(text) {
    const node = R.makeNode({ text, score: state.score, nowMs: Date.now(), sequence: state.sequence++ })
    state.nodes.push(node)
    renderNode(node)
    R.saveNodes(state.nodes, localStorage)
  }

  function restoreNodes() {
    const saved = R.loadNodes(localStorage)
    for (const node of saved) {
      state.sequence = Math.max(state.sequence, node.sequence + 1)
      state.nodes.push(node)
      renderNode(node)
    }
  }

  function drawLinks() {
    const links = R.linkNodes(state.nodes)
    const byId = new Map(state.nodes.map(node => [node.id, node]))
    ctx.lineWidth = 1
    for (const link of links) {
      const from = byId.get(link.from)
      const to = byId.get(link.to)
      if (!from || !to) continue
      ctx.strokeStyle = `hsla(${210 - 175 * state.score}, 80%, 72%, .13)`
      ctx.beginPath()
      ctx.moveTo(from.x * width, from.y * height)
      ctx.lineTo(to.x * width, to.y * height)
      ctx.stroke()
    }
  }

  function drawField(now) {
    const hue = 210 - 175 * state.score
    const soften = now < state.nudgeUntil ? .45 : 1
    ctx.fillStyle = 'rgba(4,8,18,.2)'
    ctx.fillRect(0, 0, width, height)

    const glow = ctx.createRadialGradient(width * .5, height * .48, 0, width * .5, height * .48, Math.max(width, height) * .7)
    glow.addColorStop(0, `hsla(${hue}, 72%, 34%, ${(.1 + state.score * .16) * soften})`)
    glow.addColorStop(1, 'rgba(4,8,18,0)')
    ctx.fillStyle = glow
    ctx.fillRect(0, 0, width, height)

    const maxRadius = Math.hypot(width, height) * .55
    const speed = (.018 + state.score * .06) * soften
    for (let i = 0; i < 7; i++) {
      const radius = ((now * speed + i * maxRadius / 7) % maxRadius)
      const alpha = (1 - radius / maxRadius) * (.04 + state.score * .1) * soften
      ctx.strokeStyle = `hsla(${hue + i * 4}, 85%, 70%, ${alpha})`
      ctx.lineWidth = 1 + state.score * 2
      ctx.beginPath()
      ctx.arc(width * .5, height * .48, radius, 0, Math.PI * 2)
      ctx.stroke()
    }

    for (let i = 0; i < 48; i++) {
      const phase = i * 1.618
      const drift = now * (.00008 + state.score * .00022)
      const px = (Math.sin(phase + drift) * .5 + .5) * width
      const py = (Math.cos(phase * .79 + drift * .73) * .5 + .5) * height
      const size = .6 + state.score * 1.8
      ctx.fillStyle = `hsla(${hue + 12}, 90%, 82%, ${(.06 + state.score * .24) * soften})`
      ctx.beginPath()
      ctx.arc(px, py, size, 0, Math.PI * 2)
      ctx.fill()
    }

    drawLinks()
  }

  function frame(now) {
    const dt = Math.min(now - state.lastFrame, 100)
    state.lastFrame = now

    state.keyTimes = state.keyTimes.filter(time => now - time < 1000)
    state.pointerTimes = state.pointerTimes.filter(time => now - time < 1000)
    const audio = readAudio(now)
    const idleMs = now - state.lastInputAt

    state.score = R.updateScore({
      micLevel: audio.micLevel,
      spectralCentroid: audio.spectralCentroid,
      typingRate: state.keyTimes.length,
      pointerRate: state.pointerTimes.length,
      idleMs,
      previousScore: state.score,
      dtMs: dt
    })

    if (state.score >= .5) {
      if (state.highSince === null) state.highSince = now
    } else {
      state.highSince = null
    }

    if (R.shouldNudge({
      score: state.score,
      highSinceMs: state.highSince,
      lastNudgeAtMs: state.lastNudgeAt,
      nowMs: now
    })) {
      state.lastNudgeAt = now
      showWhisper(nudges[Math.floor(Math.random() * nudges.length)], now)
    }

    drawField(now)
    requestAnimationFrame(frame)
  }

  listenButton.addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
      const AudioContext = window.AudioContext || window.webkitAudioContext
      const context = new AudioContext()
      const analyser = context.createAnalyser()
      analyser.fftSize = 1024
      context.createMediaStreamSource(stream).connect(analyser)
      state.audio = {
        analyser,
        timeData: new Uint8Array(analyser.fftSize),
        freqData: new Uint8Array(analyser.frequencyBinCount)
      }
    } catch (error) {
      state.audio = null
    }
    listenButton.remove()
  })

  window.addEventListener('keydown', event => {
    if (event.key === 'Enter' && event.target === phrase) return
    markKey()
  })

  window.addEventListener('pointermove', () => {
    if (state.pointerTimes.length && performance.now() - state.pointerTimes[state.pointerTimes.length - 1] < 90) return
    markPointer()
  })

  form.addEventListener('submit', event => {
    event.preventDefault()
    const text = phrase.value.trim()
    if (!text) return
    addNode(text)
    phrase.value = ''
    markKey()
  })

  window.addEventListener('resize', resize)

  resize()
  restoreNodes()
  requestAnimationFrame(frame)
})()
</script>
</body>
</html>
